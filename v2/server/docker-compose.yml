services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: smavo
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: smavo
    ports:
      - "5433:5432"
    volumes:
      - smavo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smavo -d smavo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - smavo-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smavo-postgres:
  smavo-redis:
