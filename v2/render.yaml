services:
  - type: web
    name: smavo-7kaih-api
    runtime: node
    plan: free
    rootDir: v2/server
    buildCommand: npm ci --include=dev && npm run build && npm run db:push
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: GOOGLE_SHEETS_CSV_URL
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: SESSION_COOKIE_NAME
        value: smavo.sid
      - key: SESSION_TTL_SECONDS
        value: "28800"
      - key: ENABLE_DEMO_LOGIN
        value: "false"
