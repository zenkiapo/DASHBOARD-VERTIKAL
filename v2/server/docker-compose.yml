services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: smavo
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: smavo
    ports:
      - "5433:5432"
    volumes:
      - smavo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smavo -d smavo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smavo-postgres:
